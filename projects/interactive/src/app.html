<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      /* Runs before anything paints (prototype chunk 5).
         'js' turns on the headline's hidden start state, so with JavaScript off it is never hidden.
         The timeout is a failsafe: if the app never starts (an error, a blocked bundle), the headline still appears. */
      document.documentElement.classList.add('js');
      setTimeout(() => document.documentElement.classList.add('is-ready'), 2500);
    </script>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,550;1,6..72,400&display=swap" />
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
